  nota_precisione: ""
descrizione: >
  Il più grande complesso boschivo di pianura ricostruito nel Veneto
  orientale (circa 110 ettari), piantato tra il 1994 e il 1997 su
  terreni agricoli restituiti a bosco di farnia, carpino bianco e
  acero campestre. All'interno un osservatorio ornitologico con
  laghetto e un roccolo storico per la cattura tradizionale degli
  uccelli (oggi solo struttura dimostrativa), oltre a percorsi
  ciclo-pedonali e un centro visite.
