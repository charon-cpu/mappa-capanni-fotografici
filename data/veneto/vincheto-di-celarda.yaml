id: vincheto-di-celarda
nome: Riserva Naturale Biogenetica Vincheto di Celarda
tipo: oasi_riserva
regione: Veneto
provincia: Belluno
comune: Feltre
posizione:
  precisione: esatta
  lat: 46.0172410
  lon: 11.9756630
  nota_precisione: ""
descrizione: >
  Riserva naturale statale (D.M. 28/12/1971) nell'antico alveo del
  Piave, in pianura a 230 m di quota, facilmente accessibile a piedi.
  Zona umida di importanza internazionale Ramsar, ZSC e ZPS. Il nome
  deriva dalla coltivazione di vinchi (rami flessibili di salice) per
  la vimineria. Nidificano 45 specie di uccelli, con altre 17 nelle
  aree immediatamente adiacenti; presenti anche pipistrelli, moscardino,
  ululone dal ventre giallo, pelobate fosco e trota marmorata.
specie_principali:
  - Smergo maggiore
  - Gufo comune
  - Quaglia
  - Stiaccino
  - Strillozzo
  - Ululone dal ventre giallo
  - Trota marmorata
periodo_migliore:
  - primavera-estate (nidificazione)
prenotazione_necessaria: false
prezzo_indicativo: "ingresso gratuito"
come_arrivare: >
  Da Feltre (BL), Strada Statale 50 in direzione Celarda, pochi
  chilometri dal centro città.
