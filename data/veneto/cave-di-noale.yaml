id: cave-di-noale
nome: Oasi WWF Cave di Noale
tipo: oasi_riserva
regione: Veneto
provincia: Venezia
comune: Noale
posizione:
  precisione: esatta
  lat: 45.5549959
  lon: 12.0758050
  nota_precisione: ""
descrizione: >
  Ex cave di argilla per la fornace di Cavasin, dismesse nei primi anni
  '70 e trasformate in un sistema di stagni a profondità variabile, oggi
  Zona Speciale di Conservazione. Circa 20 ettari con percorso natura e
  punti di osservazione accessibili anche a persone con disabilità.
specie_principali: []
periodo_migliore:
  - da verificare
prenotazione_necessaria: false
prezzo_indicativo: "non specificato, da verificare"
come_arrivare: >
  Strada degli Ongari, all'incrocio con via Alcide De Pol, Noale (VE).
  Raggiungibile in auto via SR515/SR245 o a piedi dalla stazione
  ferroviaria di Noale-Scorzè (circa 7 minuti).
