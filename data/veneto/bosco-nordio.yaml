id: bosco-nordio
nome: Riserva Naturale Integrale Bosco Nordio
tipo: oasi_riserva
regione: Veneto
provincia: Venezia
comune: Chioggia
posizione:
  precisione: esatta
  lat: 45.1258488
  lon: 12.2619014
  nota_precisione: ""
descrizione: >
  Riserva naturale statale istituita nel 1971, 113,54 ettari sul più
  antico sistema dunale della costa veneziana, tra Chioggia e il Po.
  Formazione forestale rara di carpino-leccio, importante sito di
  nidificazione per specie forestali oggi rare in pianura. Visitabile
  solo con guida su prenotazione tramite Veneto Agricoltura.
specie_principali:
  - Torcicollo
  - Sparviero
  - Assiolo
  - Poiana
  - Picchio rosso maggiore
  - Cinciarella
  - Cinciallegra
  - Colombaccio
  - Ghiandaia
  - Rigogolo
periodo_migliore:
  - primavera (periodo di nidificazione)
prenotazione_necessaria: true
