id: oasi-cervara
nome: Capanni fotografici dell'Oasi Cervara
tipo: capanno_fotografico
regione: Veneto
provincia: Treviso
comune: Quinto di Treviso
posizione:
  precisione: esatta
  lat: 45.6379750
  lon: 12.1439457
  nota_precisione: >
    Coordinata sulla Via Cornarotta (Santa Cristina di Quinto di Treviso),
    strada di accesso all'oasi; da affinare sull'ingresso esatto.
descrizione: >
  Oasi naturalistica sul fiume Sile con due capanni fotografici a
  pagamento, "Poiana" e "Porciglione". Il capanno Poiana è frequentato da
  poiana, gazza e ghiandaia; il capanno Porciglione da martin pescatore,
  picchio rosso maggiore e piccoli passeriformi di bosco. Nell'oasi sono
  osservabili anche cicogna bianca, airone bianco maggiore, garzetta,
  cormorano, airone cenerino, barbagianni e cigno reale.
specie_principali:
  - Martin pescatore
  - Poiana
  - Picchio rosso maggiore
  - Sparviero
  - Cicogna bianca
  - Airone bianco maggiore
  - Garzetta
  - Barbagianni
