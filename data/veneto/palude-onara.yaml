descrizione: >
  Riserva Naturale Regionale di Interesse Locale (istituita nel 1994,
  SIC/ZPS dal 2000) lungo la linea delle risorgive a sud di Cittadella,
  vicino al fiume Tergola. Circa 120 ettari, di cui 50 di interesse
  naturalistico, con percorsi su viottoli e passerelle in legno e
  pannelli didattici. Ambiente di risorgiva favorevole a specie di
  bosco umido e canneto.
specie_principali:
  - Airone cenerino
  - Porciglione
  - Picchio verde
  - Picchio rosso maggiore
  - Cannaiola
  - Gallinella d'acqua
  - Martin pescatore
