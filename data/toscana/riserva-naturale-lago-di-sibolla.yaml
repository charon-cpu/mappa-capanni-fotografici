id: riserva-naturale-lago-di-sibolla
nome: "Riserva naturale Lago di Sibolla"
tipo: oasi_riserva
regione: Toscana
provincia: Lucca
comune: Altopascio
posizione:
  precisione: area_approssimata
  lat: 43.8240648
  lon: 10.6941163
  nota_precisione: "Coordinata sulla via di accesso (zona industriale Altopascio): l'indirizzo esatto della riserva non è geocodificabile con precisione."
descrizione: >
  Riserva LIPU di 64 ettari su un piccolo lago costiero relitto, sito Ramsar dal 1996. 147 specie di uccelli documentate, con una garzaia che ospita 11 specie e oltre 1.200 coppie riproduttive; presenti anche spatole, nitticore, tarabusini, falchi di palude, martin pescatore e la testuggine palustre europea.
specie_principali:
  - Nitticora
  - Tarabusino
  - "Falco di palude"
  - "Martin pescatore"
  - "Testuggine palustre europea"
periodo_migliore:
  - "primavera-estate (garzaia attiva)"
prenotazione_necessaria: true
prezzo_indicativo: "da verificare"
come_arrivare: >
  Via dei Sandroni 15, 55011 Altopascio (LU), 2 km dal casello A11 di Altopascio.
