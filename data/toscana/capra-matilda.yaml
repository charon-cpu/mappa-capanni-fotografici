descrizione: >
  Azienda agricola biologica affiliata al WWF alle pendici del Monte Amiata, tra i comuni di Roccalbegna e Semproniano. Alleva animali di razze locali a rischio di estinzione su 62,5 ettari tra campi, prati e boschi. Fa parte del circuito "Fattorie del Panda" e offre ospitalità agrituristica.
