id: oasi-wwf-padule-orti-bottagone
nome: "Oasi WWF Padule Orti-Bottagone"
tipo: oasi_riserva
regione: Toscana
provincia: Livorno
comune: Piombino
posizione:
  precisione: esatta
  lat: 42.9542378
  lon: 10.5999014
  nota_precisione: ""
descrizione: >
  Zona umida costiera alle porte di Piombino, tra le poche paludi salmastre superstiti della costa toscana. Conta 231 specie di uccelli osservate: tra gli svernanti germano reale, codone e airone cenerino; tra i nidificanti spatola, airone rosso e falco pescatore. Sono previsti accessi dedicati per fotografi e birdwatcher in orari e giorni specifici, sempre su prenotazione.
specie_principali:
  - "Germano reale"
  - Codone
  - "Airone cenerino"
  - "Falco di palude"
  - "Falco pellegrino"
  - Spatola
  - "Airone rosso"
  - "Falco pescatore"
periodo_migliore:
  - "inverno (svernanti)"
  - "primavera (migratori)"
prenotazione_necessaria: true
prezzo_indicativo: "10 € intero, 8 € ridotto (verificare aggiornamento)"
come_arrivare: >
  Strada Prov. 40 Geodetica, km 6,700 - Località Torre del Sale, Piombino (LI).
