descrizione: >
  Area protetta di 25 ettari sulle rive del Lago di Bilancino, nel Mugello. Rifugio per uccelli migratori come tarabuso, cavaliere d'Italia e avocetta grazie alla fitta vegetazione palustre; in inverno e primavera si osservano anche fenicotteri rosa e falchi pescatori di passo, oltre a diverse specie di anatre (moriglione, mestolone, alzavola, fischione).
specie_principali:
  - Tarabuso
  - "Cavaliere d'Italia"
  - Avocetta
  - "Falco pescatore"
  - "Albanella reale"
  - "Falco pellegrino"
  - Moriglione
  - Alzavola
