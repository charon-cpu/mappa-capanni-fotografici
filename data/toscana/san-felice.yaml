descrizione: >
  Area protetta di 47,7 ettari lungo la costa tra Marina di Grosseto e Castiglione della Pescaia, nata dalla collaborazione tra il gruppo Allianz (proprietario dei terreni) e il WWF. La ghiandaia marina è la specie simbolo, nidificante anche grazie alle cassette-nido installate dai volontari WWF.
