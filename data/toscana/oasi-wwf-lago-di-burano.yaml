id: oasi-wwf-lago-di-burano
nome: "Oasi WWF Lago di Burano"
tipo: oasi_riserva
regione: Toscana
provincia: Grosseto
comune: Capalbio
posizione:
  precisione: esatta
  lat: 42.4084215
  lon: 11.3717085
  nota_precisione: ""
descrizione: >
  Riserva WWF sul lago costiero di Burano, in Maremma, con oltre 300 specie di uccelli osservate. Tra le specie caratteristiche folaga, moriglione, moretta tabaccata e falco di palude; tra i mammiferi istrice, tasso, volpe, donnola e cinghiale, con passaggi occasionali di lupo. Le visite guidate partono dal centro visite dell'oasi.
specie_principali:
  - Folaga
  - Moriglione
  - "Moretta tabaccata"
  - "Falco di palude"
  - Porciglione
  - Istrice
  - Tasso
periodo_migliore:
  - "autunno-primavera (migrazioni)"
prenotazione_necessaria: true
prezzo_indicativo: "8 € visita guidata; 2 € passeggiata al centro visite"
come_arrivare: >
  Strada provinciale Litoranea del Chiarone, 35 - Capalbio Scalo (GR). Raggiungibile anche in treno (stazione di Capalbio Scalo).
