id: riserva-naturale-del-chiarone-oasi-massaciuccoli
nome: "Riserva naturale del Chiarone (Oasi Massaciuccoli)"
tipo: oasi_riserva
regione: Toscana
provincia: Lucca
comune: Massarosa
posizione:
  precisione: esatta
  lat: 43.865594
  lon: 10.3386981
  nota_precisione: ""
descrizione: >
  Riserva LIPU di 47 ettari sulla sponda orientale del Lago di Massaciuccoli, famosa per il birdwatching fin dall'Ottocento. Circa 300 specie di uccelli documentate: aironi (cenerino, bianco maggiore, guardabuoi), avocette, chiurli, piro piro, falchi di palude, falchi pescatori e diverse sterne. Una passerella in legno di 800 metri conduce a 4 punti di osservazione, accessibile anche a persone con disabilità.
specie_principali:
  - "Airone cenerino"
  - "Airone bianco maggiore"
  - Avocetta
  - Chiurlo
  - "Falco di palude"
  - "Falco pescatore"
  - Tarabuso
periodo_migliore:
  - "marzo-aprile (migrazione)"
prenotazione_necessaria: false
prezzo_indicativo: "ingresso gratuito"
come_arrivare: >
  Via del Porto 154, 55054 Massarosa (LU).
