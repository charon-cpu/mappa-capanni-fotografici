id: padule-di-bolgheri
nome: "Oasi WWF Padule di Bolgheri"
tipo: oasi_riserva
regione: Toscana
provincia: Livorno
comune: "Castagneto Carducci"
posizione:
  precisione: area_approssimata
  lat: 43.159983
  lon: 10.6002338
  nota_precisione: "Coordinata sulla strada provinciale indicata come riferimento (SP della zona): l'accesso esatto è privato e su prenotazione, non pubblicato come indirizzo puntuale."
descrizione: >
  Rifugio faunistico privato di 513 ettari tra stagni, prati allagati e pineta, con sei osservatori faunistici lungo i sentieri tracciati. Le cicogne sono tornate a nidificare qui dal 2008, dopo 200 anni di assenza. Tra gli svernanti germano reale, fischione, mestolone, codone, canapiglia e alzavola; in primavera pittima reale, combattente, pettegola e pantana.
specie_principali:
  - "Cicogna bianca"
  - Fischione
  - Mestolone
  - Codone
  - "Pittima reale"
  - Combattente
  - Tuffetto
  - Avocetta
